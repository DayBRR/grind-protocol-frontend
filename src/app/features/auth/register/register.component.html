    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-card__logo">
          <div class="logo-box"><div class="logo-icon"></div></div>
          <h1 class="auth-card__brand">Grind Protocol</h1>
        </div>

        <h2 class="auth-card__title">Begin your grind</h2>
        <p class="auth-card__sub">Create your account and start building discipline</p>

        @if (error()) {
          <div class="auth-card__error">{{ error() }}</div>
        }

        <div class="auth-form">
          <div class="form-field">
            <label class="form-label" for="register-username">Username</label>
            <input
              id="register-username"
              type="text"
              placeholder="your_username"
              [(ngModel)]="username"
              autocomplete="username"
              [disabled]="loading()"
            />
          </div>

          <div class="form-field">
            <label class="form-label" for="register-email">Email</label>
            <input
              id="register-email"
              type="email"
              placeholder="you@example.com"
              [(ngModel)]="email"
              autocomplete="email"
              [disabled]="loading()"
            />
          </div>

          <div class="form-field">
            <label class="form-label" for="register-password">Password</label>
            <input
              id="register-password"
              type="password"
              placeholder="••••••••"
              [(ngModel)]="password"
              autocomplete="new-password"
              [disabled]="loading()"
              (keyup.enter)="submit()"
            />
          </div>

          <button
            class="btn btn-primary auth-submit"
            [disabled]="loading()"
            (click)="submit()"
          >
            {{ loading() ? 'Creating account...' : 'Create account' }}
          </button>
        </div>

        <p class="auth-card__footer">
          Already grinding? <a routerLink="/auth/login">Log in</a>
        </p>
      </div>
    </div>
